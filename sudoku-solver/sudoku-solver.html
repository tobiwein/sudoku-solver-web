<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sudoku Solver</title>
        <link rel="stylesheet" href="sudoku-solver.css">
    </head>

    <body>
        <a href="../index.html">Menu</a>
        <h1>Sudoku Solver</h1>

        <table id="sudoku-grid"></table>

        <div class="buttons">
            <button id="clear-button" onclick="clearGrid()">
                Clear
            </button>
            <button id="check-button" onclick="checkGrid()">
                Check
            </button>
            <button id="solve-button" onclick="solveGrid()" disabled>
                Solve
            </button>
        </div>

        <script src="sudoku-solver.js" defer></script>
    </body>

</html>
